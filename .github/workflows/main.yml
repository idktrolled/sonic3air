name: Build S3AIR Windows

on:
  push:

jobs:
  build:
    runs-on: windows-2022

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      - name: Configure MSBuild
        shell: powershell
        run: |

          $msbuild = (Get-Command msbuild.exe).Source

          Write-Host "MSBuild:"
          Write-Host $msbuild

          if (!(Test-Path $msbuild)) {
              Write-Error "MSBuild no encontrado"
              exit 1
          }

          $bat = @"
          @echo off
          set "msbuildPathCom=$msbuild"
          set "msbuildPathPro=$msbuild"
          "@

          Set-Content `
            -Path "framework\external\get_msbuild_path.bat" `
            -Value $bat `
            -Encoding ASCII


      - name: Verify MSBuild
        shell: cmd
        run: |
          call framework\external\get_msbuild_path.bat

          echo.
          echo ==============================
          echo MSBUILD COMMUNITY
          echo ==============================
          echo %msbuildPathCom%

          echo.
          echo ==============================
          echo MSBUILD PROFESSIONAL
          echo ==============================
          echo %msbuildPathPro%

          echo.
          echo ==============================
          echo VERSION
          echo ==============================
          "%msbuildPathCom%" -version


      - name: Build external dependencies
        shell: cmd
        run: |
          cd framework\external
          call build_externals_windows.bat


      - name: Check generated libraries
        if: always()
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "LIBRERIAS GENERADAS"
          Write-Host "======================================"

          $libs = Get-ChildItem `
            "." `
            -Recurse `
            -Filter "*.lib" `
            -ErrorAction SilentlyContinue

          if ($libs.Count -eq 0) {
              Write-Host "NO SE ENCONTRARON LIBRERIAS .LIB"
          }
          else {
              Write-Host "Encontradas $($libs.Count) librerias:"
              Write-Host ""

              foreach ($lib in $libs) {
                  Write-Host $lib.FullName
              }
          }


      - name: Build sonic3air
        shell: cmd
        run: |
          msbuild sonic3air.sln ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m ^
            /verbosity:minimal


      - name: Find executable
        if: always()
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "EXE ENCONTRADOS"
          Write-Host "======================================"

          Get-ChildItem `
            "." `
            -Recurse `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
                Write-Host $_.FullName
            }


      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S3AIR-Windows-x64
          path: |
            **/*.exe
          if-no-files-found: error
