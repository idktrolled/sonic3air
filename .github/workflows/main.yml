name: Build Sonic 3 A.I.R. - Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build external dependencies
        shell: cmd
        run: |
          framework\external\build_externals_windows.bat

      - name: Build Sonic 3 A.I.R.
        shell: cmd
        run: |
          msbuild sonic3air.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-windows
          path: |
            **/*.exe
