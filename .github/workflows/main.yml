name: Build S3AIR Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify MSBuild
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "MSBUILD"
          Write-Host "======================================"

          $msbuild = Get-Command msbuild.exe -ErrorAction Stop

          Write-Host "MSBuild encontrado:"
          Write-Host $msbuild.Source

          & $msbuild.Source -version

      # ============================================================
      # Crear get_msbuild_path.bat para los scripts originales
      # ============================================================

      - name: Configure MSBuild path
        shell: powershell
        run: |
          $msbuild = (Get-Command msbuild.exe).Source

          Write-Host "MSBuild: $msbuild"

          $bat = @"
          @echo off
          set "msbuildPathCom=$msbuild"
          set "msbuildPathPro=$msbuild"
          "@

          Set-Content `
            -Path "framework\external\get_msbuild_path.bat" `
            -Value $bat `
            -Encoding ASCII

          Write-Host ""
          Write-Host "get_msbuild_path.bat:"
          Get-Content "framework\external\get_msbuild_path.bat"

      # ============================================================
      # Mostrar configuraciones disponibles de CURL
      # ============================================================

      - name: Inspect CURL configurations
        shell: powershell
        run: |
          $projects = @(
            "framework\external\curl\curl\projects\Windows\VC14.30\lib\libcurl.vcxproj",
            "framework\external\curl\curl\projects\Windows\VC14.30\src\curl.vcxproj"
          )

          foreach ($project in $projects) {
            if (Test-Path $project) {
              Write-Host ""
              Write-Host "======================================"
              Write-Host $project
              Write-Host "======================================"

              Select-String `
                -Path $project `
                -Pattern "<ProjectConfiguration Include=" |
                ForEach-Object {
                  Write-Host $_.Line.Trim()
                }
            }
          }

      # ============================================================
      # Construir dependencias
      # ============================================================

      - name: Build external dependencies
        shell: cmd
        run: |
          cd framework\external

          echo ========================================
          echo BUILDING EXTERNAL DEPENDENCIES
          echo ========================================

          call build_externals_windows.bat

      # ============================================================
      # Comprobar librerías
      # ============================================================

      - name: Check generated libraries
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "LIBRERIAS .LIB ENCONTRADAS"
          Write-Host "======================================"

          $libs = Get-ChildItem `
            "." `
            -Recurse `
            -Filter "*.lib" `
            -ErrorAction SilentlyContinue

          if ($libs.Count -eq 0) {
            Write-Host "NO SE ENCONTRARON LIBRERIAS .LIB"
          }
          else {
            Write-Host "Encontradas $($libs.Count) librerias:"
            Write-Host ""

            foreach ($lib in $libs) {
              Write-Host $lib.FullName
            }
          }

      # ============================================================
      # Mostrar estructura de framework/lib
      # ============================================================

      - name: Check framework lib directory
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "FRAMEWORK/LIB"
          Write-Host "======================================"

          if (Test-Path "framework\lib") {
            Get-ChildItem `
              "framework\lib" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host $_.FullName
              }
          }
          else {
            Write-Host "framework\lib NO EXISTE"
          }

      # ============================================================
      # Compilar S3AIR
      # ============================================================

      - name: Build sonic3air
        shell: cmd
        run: |
          echo ========================================
          echo BUILDING SONIC3AIR
          echo ========================================

          msbuild sonic3air.sln ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m ^
            /verbosity:minimal

      # ============================================================
      # Buscar EXE
      # ============================================================

      - name: Find executable
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "EXE ENCONTRADOS"
          Write-Host "======================================"

          $exes = Get-ChildItem `
            "." `
            -Recurse `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue

          if ($exes.Count -eq 0) {
            Write-Host "NO SE ENCONTRARON EXE"
          }
          else {
            foreach ($exe in $exes) {
              Write-Host $exe.FullName
            }
          }

      # ============================================================
      # Subir EXE
      # ============================================================

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S3AIR-Windows-x64
          path: |
            **/*.exe
          if-no-files-found: error
