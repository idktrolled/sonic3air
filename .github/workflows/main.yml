name: Build Sonic 3 A.I.R. Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build external dependencies
        shell: cmd
        run: |
          cd framework\external
          build_externals_windows.bat

      - name: Build Sonic 3 A.I.R.
        shell: cmd
        run: |
          msbuild "Oxygen/sonic3air/build/_vstudio/sonic3air.sln" /p:Configuration=Release /p:Platform=x64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3AIR-Windows-x64
          path: |
            **/*.exe
