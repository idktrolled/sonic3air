name: Build Sonic 3 A.I.R. - Windows
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@main

      - name: Download Software OpenGL (Mesa3D)
        shell: cmd
        run: |
          curl -L -o bin\Release_x64\opengl32.dll https://github.com/palakis/obs-deps/releases/download/v2021-02-17/opengl32sw.dll

      - name: Build external dependencies
        shell: cmd
        working-directory: framework/external
        run: |
          call build_externals_windows.bat

      - name: Build Mastering
        shell: cmd
        working-directory: Oxygen/sonic3air/___internal/mastering
        run: |
          call mastering_windows_64bit.bat

      - name: Upload build
        uses: actions/upload-artifact@main
        with:
          name: sonic3air-windows
          path: |
            **/*.exe
