name: Build Sonic 3 A.I.R. Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build external dependencies
        shell: cmd
        working-directory: framework/external
        run: |
          call build_externals_windows.bat

      - name: Run Windows mastering
        shell: cmd
        working-directory: Oxygen/sonic3air/___internal/mastering
        run: |
          call mastering_windows_64bit.bat

      - name: Check master output
        shell: cmd
        run: |
          echo ===== Oxygen/_MASTER =====
          dir /s /b Oxygen\_MASTER

      - name: Upload Sonic 3 A.I.R. package
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3AIR-Windows-x64
          path: |
            Oxygen/_MASTER/sonic3air_game.zip
          if-no-files-found: error
