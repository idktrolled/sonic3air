name: Build S3AIR Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Comprobar MSBuild
        shell: powershell
        run: |
          msbuild -version
          where.exe msbuild

      - name: Configurar get_msbuild_path.bat
        shell: powershell
        run: |
          $file = "framework\external\get_msbuild_path.bat"

          $content = @'
          @echo off
          set "msbuildPathCom=%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          set "msbuildPathPro=%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          '@

          Set-Content -Path $file -Value $content

      - name: Build externals
        shell: cmd
        run: |
          cd framework\external
          call build_externals_windows.bat

      - name: Build S3AIR
        shell: powershell
        run: |
          msbuild sonic3air.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Find EXE
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter *.exe -Recurse

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: S3AIR-Windows
          path: |
            **/*.exe
